# RSSフィード一覧
rss_feeds:
  - name: "Googleニュース（島根）"
    url: "https://news.google.com/rss/search?q=%E5%B3%B6%E6%A0%B9&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Googleニュース（鳥取）"
    url: "https://news.google.com/rss/search?q=%E9%B3%A5%E5%8F%96&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Googleニュース（犬・ペット）"
    url: "https://news.google.com/rss/search?q=%E7%8A%AC%20%E3%83%9A%E3%83%83%E3%83%8B&hl=ja&gl=JP&ceid=JP:ja"

# RSS取得設定
fetch:
  days_back: 7                  # 直近何日以内の記事を対象にするか
  max_articles: 1               # 1回の実行で作成する記事の最大数
  processed_log: "logs/processed.json"  # 処理済み記事URLの記録先

# 記事生成設定
generation:
  model: "gemini-2.0-flash"
  max_retries: 3
  prompt_template: "prompts/article_prompt.txt"
  media_name: "イヌとサンイン"
  media_description: "山陰（島根県・鳥取県）の愛犬家向けメディア"
  image_model: "gemini-2.0-flash"
  image_save_dir: "logs/images"

# note下書き保存設定
note:
  draft_only: true              # 常にtrue固定（公開ボタンは操作しない）
  headless: false               # true だとエディタが読み込まれず止まることを確認済み
  home_url: "https://note.com/"
  selectors:
    post_link: "a:has-text('投稿')"
    title_input: "textarea[placeholder='記事タイトル']"
    body_editor: "div.note-common-styles__textnote-body"
    save_draft_button: "button:has-text('下書き保存')"
    eyecatch_add_button: "button[aria-label='画像を追加']"
    eyecatch_upload_menu_item: "text=画像をアップロード"
    eyecatch_file_input: "#note-editor-eyecatch-input"
    eyecatch_crop_save_button: "div.ReactModal__Overlay button:has-text('保存')"
  storage_state_path: "logs/note_session.json"
