name: Daily Note Draft
# 毎日 日本時間 7:00 (UTC 22:00) に自動実行する。
# GitHub Actionsのcronは常にUTC基準のため、UTC 22:00 = JST 翌7:00 を指定している。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}
jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Playwright用Chromiumをインストール
        run: playwright install --with-deps chromium
      - name: Xvfbをインストール
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Xvfbを起動
        # note.comがheadless=trueのブラウザを検知してエディタが読み込まれないため、
        # headless=falseで動かす必要がある。画面のないCI環境では
        # Xvfb（仮想ディスプレイ）上で実ブラウザを表示させることで対応する。
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: noteログインセッションを復元
        # noteはログインにreCAPTCHAがあり自動ログインできないため、
        # 事前に `python scripts/note_manual_login.py` で手動ログインして生成した
        # logs/note_session.json をbase64化し、リポジトリのSecret
        # `NOTE_SESSION_STATE_BASE64` に登録しておく。
        # セッションが失効した場合は手元で再ログイン→Secretを更新すること。
        run: |
          mkdir -p logs
          echo "${{ secrets.NOTE_SESSION_STATE_BASE64 }}" | base64 --decode > logs/note_session.json
          echo "----- セッションファイルの先頭200文字 -----"
          cat logs/note_session.json | head -c 200
          echo ""
          echo "----- ファイルサイズ -----"
          wc -c logs/note_session.json
      - name: エージェントを実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py
      - name: 失敗時にログ・スクリーンショットをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-note-agent-logs
          path: |
            logs/*.log
            logs/*.png
          retention-days: 7
